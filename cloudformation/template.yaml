AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Amazon ECR private repository with immutable tags, scan on push, AES256 or KMS
  encryption at rest, lifecycle rules to expire old images, and an optional
  cross-account pull policy.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Repository
        Parameters:
          - ProjectName
          - RepositoryBaseName
          - ImageTagMutability
          - ForceDelete
          - CiSuffix
      - Label:
          default: Security
        Parameters:
          - ScanOnPush
          - EncryptionType
          - KmsKeyArn
          - PullPrincipalArns
      - Label:
          default: Lifecycle
        Parameters:
          - UntaggedImageExpiryDays
          - MaxTaggedImageCount
      - Label:
          default: Tagging
        Parameters:
          - Environment
          - Owner

Parameters:
  ProjectName:
    Type: String
    Description: Project name used as the prefix of the repository name.
    AllowedPattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    ConstraintDescription: Project name must be lowercase letters, numbers, and hyphens, starting and ending with a letter or number.
    MinLength: 1
    MaxLength: 20

  RepositoryBaseName:
    Type: String
    Description: Base name of the ECR repository. Account ID, environment, and region are appended to form the full name.
    AllowedPattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)*$"
    ConstraintDescription: Must be lowercase letters, numbers, hyphens, underscores, or periods, starting and ending with a letter or number.
    MinLength: 2
    MaxLength: 100

  CiSuffix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9]+(?:[._-][a-z0-9]+)*$"
    ConstraintDescription: CI suffix must be empty or lowercase letters, numbers, hyphens, underscores, or periods, starting and ending with a letter or number.
    MaxLength: 32
    Description: "Optional CI suffix appended to the repository name (for example, my-app-pr42)"

  ImageTagMutability:
    Type: String
    Default: MUTABLE
    AllowedValues:
      - IMMUTABLE
      - MUTABLE
    Description: Whether image tags can be overwritten. IMMUTABLE is recommended.

  ForceDelete:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: If true, CloudFormation deletes the repository even when it still contains images.

  ScanOnPush:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Run a basic vulnerability scan on every image push.

  EncryptionType:
    Type: String
    Default: KMS
    AllowedValues:
      - AES256
      - KMS
    Description: Encryption at rest. Use KMS with KmsKeyArn for customer-managed keys.

  KmsKeyArn:
    Type: String
    Default: "alias/SB-KMS"
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/[A-Za-z0-9:/_-]+$|^alias/[A-Za-z0-9:/_-]+$|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    ConstraintDescription: Must be empty, a KMS key ARN, a KMS alias ARN, a KMS alias name (alias/...), or a KMS key ID.
    Description: >
      KMS key to encrypt the repository with. Accepts a key ARN, alias ARN, alias name
      (alias/my-key), or key ID. Required when EncryptionType is KMS.

  PullPrincipalArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Optional comma-separated IAM role or account ARNs granted pull access
      (for example, a cross-account role). Leave empty to skip the repository policy.

  UntaggedImageExpiryDays:
    Type: Number
    Default: 14
    MinValue: 1
    MaxValue: 365
    Description: Days after which untagged images expire.

  MaxTaggedImageCount:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 1000
    Description: Maximum number of tagged images to retain.

  Environment:
    Type: String
    Default: devl
    AllowedValues:
      - devl
      - test
      - prod

  Owner:
    Type: String
    Default: platform-team
    Description: Owner tag value.

Conditions:
  UseKmsWithKey: !And
    - !Equals [!Ref EncryptionType, KMS]
    - !Not [!Equals [!Ref KmsKeyArn, ""]]
  HasPullPrincipals: !Not [!Equals [!Join ["", !Ref PullPrincipalArns], ""]]
  ForceDeleteEnabled: !Equals [!Ref ForceDelete, "true"]
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]

Rules:
  KmsKeyRequired:
    RuleCondition: !Equals [!Ref EncryptionType, KMS]
    Assertions:
      - Assert: !Not [!Equals [!Ref KmsKeyArn, ""]]
        AssertDescription: KmsKeyArn must be provided when EncryptionType is KMS.

Resources:
  EcrRepository:
    Metadata:
      com.aws.cloudformation.Context:
        why: >
          Private container image repository with immutable tags, scan on push,
          AES256 or KMS encryption at rest, lifecycle rules to expire old images,
          and an optional cross-account pull policy.
        must:
          - When EncryptionType is KMS, KmsKeyArn must be provided (enforced by the KmsKeyRequired rule).
        trust:
          src: comment
          conf: high
          note: "Rationale taken from the template Description and parameter descriptions"
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !If
        - HasCiSuffix
        - !Sub '${ProjectName}-${RepositoryBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}'
        - !Sub '${ProjectName}-${RepositoryBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}'
      ImageTagMutability: !Ref ImageTagMutability
      ImageScanningConfiguration:
        ScanOnPush: !Ref ScanOnPush
      EncryptionConfiguration:
        EncryptionType: !Ref EncryptionType
        KmsKey: !If [UseKmsWithKey, !Ref KmsKeyArn, !Ref AWS::NoValue]
      EmptyOnDelete: !If [ForceDeleteEnabled, true, !Ref AWS::NoValue]
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after ${UntaggedImageExpiryDays} days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": ${UntaggedImageExpiryDays}
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the most recent ${MaxTaggedImageCount} tagged images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${MaxTaggedImageCount}
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !If
            - HasCiSuffix
            - !Sub '${ProjectName}-${RepositoryBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}'
            - !Sub '${ProjectName}-${RepositoryBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
      RepositoryPolicyText: !If
        - HasPullPrincipals
        - Version: "2012-10-17"
          Statement:
            - Sid: AllowCrossAccountPull
              Effect: Allow
              Principal:
                AWS: !Ref PullPrincipalArns
              Action:
                - ecr:BatchGetImage
                - ecr:GetDownloadUrlForLayer
                - ecr:BatchCheckLayerAvailability
        - !Ref AWS::NoValue

Outputs:
  RepositoryName:
    Description: Name of the ECR repository.
    Value: !Ref EcrRepository

  RepositoryArn:
    Description: ARN of the ECR repository.
    Value: !GetAtt EcrRepository.Arn

  RepositoryUri:
    Description: URI used for docker push and pull.
    Value: !GetAtt EcrRepository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryUri"
